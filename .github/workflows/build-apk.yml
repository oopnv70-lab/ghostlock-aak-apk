name: Build APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 从 Secrets 还原 keystore（固定同一个文件，每次构建复用）
      - name: Decode keystore
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ks/release.p12"
          echo "keystore size: $(wc -c < "$RUNNER_TEMP/ks/release.p12") bytes"
          sha256sum "$RUNNER_TEMP/ks/release.p12"

      - name: Build Release APK (signed)
        env:
          KS_PATH: ${{ runner.temp }}/ks/release.p12
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KS_PATH" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KS_PASS"

      # 列出产物，方便排查
      - name: List APK outputs
        run: find app/build/outputs/apk -type f -name '*.apk' -exec ls -la {} \;

      - name: Rename APK
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "source: $SRC"
          cp "$SRC" "$RUNNER_TEMP/ghostlock-aak-release.apk"
          ls -la "$RUNNER_TEMP/ghostlock-aak-release.apk"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-aak-apk-release
          path: ${{ runner.temp }}/ghostlock-aak-release.apk
          if-no-files-found: error

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/ghostlock-aak-release.apk
          generate_release_notes: true
