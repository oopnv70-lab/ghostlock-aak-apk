plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghostlock.aak'
    compileSdk 34

    defaultConfig {
        applicationId "com.ghostlock.aak"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 签名配置：从 CI 环境变量读取 keystore 信息
    // - 若环境变量缺失（本地普通构建），release 会退回 debug 签名，不会中断构建
    signingConfigs {
        release {
            def ksPath  = System.getenv("KS_PATH")
            def ksPass  = System.getenv("KS_PASS")
            def ksAlias = System.getenv("KS_ALIAS")
            if (ksPath != null && ksPass != null && ksAlias != null) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksPass
                storeType "PKCS12"
            }
        }
    }

    buildFeatures {
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
            // 有签名配置就用正式签名，否则退回 debug
            def ksPath = System.getenv("KS_PATH")
            if (ksPath != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.3.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}